
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DocuShield</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <nav>
        <h2>DocuShield</h2>
        <a href="/">Home</a>
    </nav>

    <main>
        <h1>Welcome to DocuShield</h1>

        <p>
            A secure document management and
            access control system.
        </p>

        <p>
            Store, manage and protect your documents.
        </p>

        {% if current_user.is_authenticated %}
            <p><a href="{{ url_for('dashboard') }}">Open Dashboard</a></p>
        {% else %}
            <p><a href="{{ url_for('register') }}">Register</a></p>
            <p><a href="{{ url_for('login') }}">Login</a></p>
        {% endif %}
    </main>

</body>
</html>
